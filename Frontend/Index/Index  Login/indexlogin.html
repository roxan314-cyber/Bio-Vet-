<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión | BioVet Enterprise</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <link rel="stylesheet" href="/assets/login.css">
</head>
<body>
    <div class="login-box">
        <form id="loginForm">
            <h2>Iniciar sesión</h2>

            <div class="input-group">
                <i class="fas fa-envelope" aria-hidden="true"></i>
                <input type="email" id="email" name="email" placeholder="Correo electrónico" autocomplete="email" required>
                <label for="email">Correo electrónico</label>
            </div>

            <div class="input-group">
                <i class="fas fa-lock" aria-hidden="true"></i>
                <input type="password" id="password" name="password" placeholder="Contraseña" autocomplete="current-password" required>
                <label for="password">Contraseña</label>
            </div>

            <button type="submit" class="login-btn" id="submitBtn">Iniciar Sesión</button>
            <p id="errorMessage" role="status" aria-live="polite"></p>

            <p class="signup-link">
                ¿Eres nuevo aquí? <a href="/registro">Crea una cuenta</a>
            </p>
        </form>
    </div>

    <script src="/assets/api-client.js" defer></script>
    <script src="/assets/session-store.js" defer></script>
    <script src="/assets/login.js" defer></script>
</body>
</html>
